[package]
name = "soyo-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
soyo-core = { path = "../../crates/soyo-core" }
soyo-app = { path = "../../crates/soyo-app" }
soyo-contract = { path = "../../crates/soyo-contract" }
soyo-fs = { path = "../../crates/soyo-fs" }
tauri = { version = "=2.12.5", features = ["specta"] }
tauri-plugin-updater = "=2.14.1"
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json", "uuid"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta-typescript = "=0.0.13"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "=1.29.0", features = ["v7", "serde"] }
sha2 = "=0.11.1"
base64 = "=0.22.1"
tauri-plugin-dialog = "=2.8.4"

[dev-dependencies]
tempfile = "=3.27.0"
