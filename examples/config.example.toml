# Copy this file before editing. No credential values belong in this file.
schema_version = 1

[defaults]
profile = "local"
mode = "work"
permissions = "auto"
output = "text"

# Replace these values with the protocol, API root, model and actual context
# window of your own local service. config check does not contact the service.
[profiles.local]
protocol = "openai-chat-completions"
base_url = "http://127.0.0.1:8000/v1"
model = "YOUR_LOCAL_MODEL"
auth = "none"
context_window_tokens = 128000
stream = true
# Optional, only for models that support the requested effort level.
# thinking_effort = "max"
# Optional explicit request target. Omission uses limit.output, or 32000 when
# the model has no declared output default. Explicit values take precedence.
# max_output_tokens = 16000
# Optional model metadata. Replace this illustrative value for your model.
# [profiles.local.limit]
# output = 32000

# For an authenticated service, configure an additional profile and reference
# an environment variable NAME. Never put its value in this file:
# [profiles.remote]
# protocol = "openai-responses"
# base_url = "https://example.com/v1"
# model = "YOUR_MODEL"
# auth = "bearer"
# api_key_env = "SAYA_API_KEY"
# context_window_tokens = 128000

# N2 development defaults. Backend preparation happens when a run starts.
# config check validates policy syntax without launching native isolation.
[sandbox]
backend = "auto"
read_roots = []
write_roots = []
protected_paths = []

[sandbox.network]
mode = "deny"

# Enable a server only after selecting its executable, permissions and roots.
# Toolchain files outside the workspace may require sandbox.read_roots.
[mcp.servers.local_example]
enabled = false
read_only_tools = []

[mcp.servers.local_example.transport]
type = "stdio"
argv = ["/absolute/path/to/mcp-server", "--stdio"]
# env = { SERVICE_TOKEN = "SAYA_MCP_TOKEN" }

[mcp.servers.remote_example]
enabled = false
read_only_tools = []

[mcp.servers.remote_example.transport]
type = "http"
endpoint = "https://mcp.example.invalid/mcp"
# bearer_env = "SAYA_MCP_TOKEN"
# credential_ref = "00000000-0000-0000-0000-000000000000"
# scopes = ["files:read"]

# N3 context uses the selected profile's window and output limit. It also
# reserves ceil(window / 10) + 1 safety tokens, plus the extra amount below.
[context]
auto_compact = true
trigger_percent = 80
target_percent = 55
extra_safety_tokens = 0
# Omission inherits the selected execution profile's output target.
# summary_max_output_tokens = 16000
max_compaction_calls = 32
compaction_timeout_seconds = 600

# The default host-selected root is ~/.saya. A missing store stays absent until
# an approved write. read=false also suppresses automatic memory injection.
# Explicit --memory-file input remains independent from these switches.
[memory]
read = true
inject = true
write = true
# root = "/absolute/path/to/private-memory"

# Local installation and enablement require explicit plugin management commands.
[plugins]
enabled = true
