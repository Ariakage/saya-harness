name: Release candidates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x86_64
          - runner: ubuntu-22.04-arm
            target: linux-aarch64
          - runner: macos-15-intel
            target: macos-x86_64
          - runner: macos-15
            target: macos-aarch64
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Check workspace and build release binary
        run: |
          ./scripts/check.sh
          expected_version=$(cargo metadata --no-deps --locked --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "saya-cli"))')
          test "$(target/release/saya --version)" = "saya $expected_version"
      - name: Check packaging and verification tools
        run: |
          python3 scripts/release/test_package.py
          python3 scripts/release/test_verify_macos15.py
          python3 scripts/release/test_verify_linux.py
          python3 scripts/release/test_script_helpers.py
      - name: Package the native candidate
        run: |
          python3 scripts/release/package.py --source-commit "$GITHUB_SHA" --output candidate --target '${{ matrix.target }}' --binary '${{ matrix.target }}=target/release/saya'
      - name: Verify the packaged binary on its minimum OS
        shell: bash
        run: |
          archives=(candidate/*.tar.gz)
          test "${#archives[@]}" = 1
          checksum=$(cut -d' ' -f1 candidate/SHA256SUMS)
          if [ "$RUNNER_OS" = macOS ]; then
            python3 scripts/release/verify_macos15.py "${archives[0]}" --sha256 "$checksum" --source-commit "$GITHUB_SHA" --output candidate/verification.json
          else
            python3 scripts/release/verify_linux.py "${archives[0]}" --sha256 "$checksum" --source-commit "$GITHUB_SHA" --output candidate/verification.json
          fi
          python3 -c 'import json, os, pathlib; evidence = json.loads(pathlib.Path("candidate/verification.json").read_text()); assert evidence["declared_source_commit"] == os.environ["GITHUB_SHA"]'
      - name: Retain the verified candidate and evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saya-${{ matrix.target }}
          path: candidate/
          if-no-files-found: error
          retention-days: 14
