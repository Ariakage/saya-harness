name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Advisory audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Run cargo audit
        run: |
          cargo install --locked cargo-audit
          cargo audit

  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel]
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Install native Linux isolation tools
        if: startsWith(matrix.os, 'ubuntu-')
        run: ./scripts/n2/install-linux-tools.sh
      - name: Check workspace
        run: ./scripts/check.sh
      - name: Check workspace tooling
        run: |
          python3 -B scripts/test_prompt_eval.py
          python3 -B scripts/n2/test_install_linux_tools.py
          python3 -B scripts/n2/test_native_acceptance.py
          python3 -B scripts/n2/test_verify_performance.py
          python3 -B scripts/release/test_package.py
          python3 -B scripts/release/test_verify_macos15.py
          python3 -B scripts/release/test_verify_linux.py
          python3 -B scripts/release/test_script_helpers.py
          python3 -B -m unittest discover -s scripts/n3 -p 'test_*.py'
          python3 -B scripts/n5/test_browser_vm.py
          python3 -I -B scripts/n5/test_acceptance.py
          python3 -B scripts/n5/test_witness.py
      - name: Verify macOS 15 release smoke
        if: startsWith(matrix.os, 'macos-')
        run: |
          test "$(sw_vers -productVersion | cut -d. -f1)" = 15
          otool -l target/release/saya > "$RUNNER_TEMP/saya-otool.txt"
          grep -Eq '^[[:space:]]*minos[[:space:]]+15\.0([[:space:]]|$)' "$RUNNER_TEMP/saya-otool.txt"
      - name: Exercise release binary
        run: |
          python3 scripts/release/smoke.py target/release/saya
          python3 scripts/release/journey.py target/release/saya
          python3 scripts/release/review_regressions.py target/release/saya
          python3 scripts/release/tui_journey.py target/release/saya
