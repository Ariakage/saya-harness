name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Advisory audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Run cargo audit
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo audit

  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel]
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Install native Linux isolation tools
        if: startsWith(matrix.os, 'ubuntu-')
        run: ./scripts/n2/install-linux-tools.sh
      - name: Check workspace
        run: ./scripts/check.sh
      - name: Check workspace tooling
        run: ./scripts/test-tooling.sh
      - name: Verify macOS 15 release smoke
        if: startsWith(matrix.os, 'macos-')
        run: |
          test "$(sw_vers -productVersion | cut -d. -f1)" = 15
          otool -l target/release/soyo > "$RUNNER_TEMP/soyo-otool.txt"
          grep -Eq '^[[:space:]]*minos[[:space:]]+15\.0([[:space:]]|$)' "$RUNNER_TEMP/soyo-otool.txt"
      - name: Exercise release binary
        run: |
          python3 scripts/release/smoke.py target/release/soyo
          python3 scripts/release/journey.py target/release/soyo
          python3 scripts/release/review_regressions.py target/release/soyo
          python3 scripts/release/tui_journey.py target/release/soyo

  desktop-frontend:
    name: Desktop frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '10.33.0'
          package_json_file: desktop/package.json
      - name: Install desktop frontend dependencies
        run: pnpm --dir desktop install --frozen-lockfile
      - name: Typecheck, test, and build desktop frontend
        run: pnpm --dir desktop run check
