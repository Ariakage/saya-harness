<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="description" content="Download Soyo Harness — prebuilt archives for macOS 15+ and Linux, or build the Rust agent runtime from source." />
    <meta name="theme-color" content="#101010" />
    <title>Download — Soyo Harness</title>
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("soyo.theme"); } catch (e) {}
        if (t !== "dark" && t !== "light") {
          t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/download.tsx"></script>
  </body>
</html>
