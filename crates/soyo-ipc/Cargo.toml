[package]
name = "soyo-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
soyo-core = { path = "../soyo-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json", "uuid"] }
specta-typescript = "=0.0.13"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
uuid = { version = "=1.29.0", features = ["v7", "serde"] }
interprocess = { version = "=2.3.0", features = ["tokio"] }

[dev-dependencies]
tempfile = "=3.27.0"
