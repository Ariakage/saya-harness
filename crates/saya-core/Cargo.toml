[package]
name = "saya-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time", "test-util"] }

[dependencies]
cap-std = "4.0.3"
bytes = "1.12.1"
diffy = "0.5.2"
globset = "0.4.21"
ignore = "0.4.34"
jsonschema = { version = "=0.61.0", default-features = false }
libc = "0.2.191"
nix = { version = "0.31.3", features = ["signal", "process"] }
regex = "1.13.1"
reqwest = { version = "0.12.28", default-features = false, features = ["http2", "json", "rustls-tls", "system-proxy"] }
httpdate = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
toml = "1.2.0"
uuid = { version = "1.29.0", features = ["v7", "serde"] }
serde_yaml_ng = "0.10"
rusqlite = { version = "0.37", features = ["bundled", "backup", "serialize", "hooks"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
