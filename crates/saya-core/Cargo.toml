[package]
name = "saya-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time", "test-util"] }

[dependencies]
cap-std = "4.0.3"
diffy = "0.5.2"
globset = "0.4.21"
ignore = "0.4.34"
libc = "0.2.191"
nix = { version = "0.31.3", features = ["signal", "process"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
uuid = { version = "1.29.0", features = ["v7", "serde"] }
