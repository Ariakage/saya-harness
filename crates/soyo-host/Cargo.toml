[package]
name = "soyo-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
soyo-core = { path = "../soyo-core" }
soyo-app = { path = "../soyo-app" }
soyo-ipc = { path = "../soyo-ipc" }
soyo-fs = { path = "../soyo-fs" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
libc = "0.2.191"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "process", "signal"] }
uuid = { version = "=1.29.0", features = ["v7", "serde"] }
sha2 = "=0.11.1"
base64 = "=0.22.1"
tempfile = "=3.27.0"
toml_edit = "=0.25.18"
