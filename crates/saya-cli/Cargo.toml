[package]
name = "saya-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "saya"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
libc = "0.2.191"
saya-app = { path = "../saya-app" }
saya-core = { path = "../saya-core" }
saya-tui = { path = "../saya-tui" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "signal", "sync", "time"] }

tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
rusqlite = { version = "0.37", features = ["bundled"] }
