[package]
name = "soyo-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "soyo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
libc = "0.2.191"
soyo-app = { path = "../soyo-app" }
soyo-contract = { path = "../soyo-contract" }
soyo-core = { path = "../soyo-core" }
soyo-fs = { path = "../soyo-fs" }
soyo-host = { path = "../soyo-host" }
soyo-ipc = { path = "../soyo-ipc" }
soyo-tui = { path = "../soyo-tui" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "signal", "sync", "time"] }

tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
rusqlite = { version = "0.43", default-features = false, features = ["bundled", "fallible_uint"] }
