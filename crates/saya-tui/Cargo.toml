[package]
name = "saya-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
saya-app = { path = "../saya-app" }
saya-core = { path = "../saya-core" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
crossterm = { version = "0.29.0", default-features = false, features = ["bracketed-paste", "events", "use-dev-tty"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt", "signal", "sync", "time"] }
unicode-segmentation = "1.12.0"
unicode-width = "0.2.0"

libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"
